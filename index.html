<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0}
body{background:#06141c;color:#e6f0f2;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.app{height:100svh;min-height:100svh;max-width:760px;margin:auto;padding:10px 12px 8px;background:
radial-gradient(circle at 80% 10%,#16404455,transparent 28%),
linear-gradient(145deg,#112a35,#06141c 62%);display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:110px minmax(0,1fr) 108px;gap:8px;align-items:center;flex:0 0 auto}

.history{height:52px;width:100%;min-width:0;border:1px solid #4b5961;border-radius:17px;background:#142832;color:#ffc54e;font-size:12px;font-weight:800;white-space:nowrap;padding:0 4px}

.order.running{border-color:#21c98e;box-shadow:0 0 9px #18d99b22}

.moneyRow{display:flex;align-items:center;justify-content:flex-start;gap:28px;min-height:28px;margin-top:2px}.moneyRow .delete{margin-left:6px}.line2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:4px}
.note{height:31px;min-width:0;background:#061720;border:1px solid #1d3842;border-radius:9px;padding:5px 8px;color:#dbe6e9;font-size:13px;outline:0}
.note::placeholder{color:#718991}
.note:focus{border-color:#2a8f7a}
.complete{height:31px;padding:0 13px;border:0;border-radius:9px;background:#18dda0;color:#04231c;font-size:13px;font-weight:900;white-space:nowrap}.delete{height:31px;padding:0 9px;border:1px solid #35474d;border-radius:9px;background:transparent;color:#70858b;font-size:11px;font-weight:600;white-space:nowrap}
.footer{display:flex;justify-content:space-between;padding:5px 3px 0;color:#91a5ac;font-size:12px;flex:0 0 auto}
.footer b{color:#fff}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end;justify-content:center;padding:10px}
.panel{width:min(720px,100%);height:min(97dvh,1000px);background:#10252f;border:1px solid #38545e;border-radius:20px;padding:10px 12px 8px;display:flex;flex-direction:column}
.panelHead{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font-size:20px}.closeX{background:none;border:0;color:#9fb1b7;font-size:25px}
.dateNav{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin-top:2px}
.dateArrow{height:32px;border:1px solid #38545e;border-radius:10px;background:#0b1d25;color:#ffc54e;font-size:30px;line-height:20px}
.periodDate{border:0;background:transparent;text-align:center;color:#f0f6f7;font-size:15px;font-weight:900;padding:4px 4px}
.todayBtn{display:block;margin:1px auto 0;height:22px;padding:0 13px;border:1px solid #38545e;border-radius:999px;background:#0b1d25;color:#9fb0b5;font-size:11px;font-weight:700}.tabs{display:flex;gap:6px;margin-top:5px}.tab{flex:1;height:34px;border:1px solid #38545e;border-radius:10px;background:#0b1d25;color:#91a5ac;font-weight:800}.tab.active{background:#18b982;color:#05221b;border-color:#18b982}.historySummary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.statsCards{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:5px;margin-top:5px}
.statCard{background:#0b1d25;border:1px solid #29434d;border-radius:9px;padding:6px 7px;min-width:0}
.statCard span{display:block;color:#91a5ac;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statCard b{display:block;color:#ffc54e;font-size:15px;margin-top:2px;white-space:nowrap}
.historySummary>div{background:#0b1d25;border:1px solid #29434d;border-radius:9px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center}.historySummary span{font-size:12px;color:#91a5ac}.historySummary b{font-size:17px;color:#ffc54e}.historyList{overflow:auto;margin-top:8px;flex:1;min-height:0;padding-bottom:4px}
.day{color:#ffc34e;font-weight:800;font-size:13px;padding:10px 2px 4px}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 3px;border-bottom:1px solid #29434d;font-size:13px}.hist span:first-child{min-width:0;overflow-wrap:anywhere}.hist small{overflow-wrap:anywhere;word-break:break-word}
.hist small{color:#80979f}.hist b{color:#ffc34e;font-size:16px}
.clear{margin-top:8px;height:40px;border:1px solid #63464b;background:#2b2024;color:#ffb0b0;border-radius:10px;font-weight:700}
@media(max-width:430px){.todayBar{padding:3px 2px;font-size:10px}.todayBar b{font-size:12px}.statsCards{gap:5px}.statCard{padding:7px 6px}.statCard b{font-size:14px}.top{grid-template-columns:98px minmax(0,1fr) 102px}.history{font-size:11px}.money{font-size:17px}.money input{width:54px;font-size:18px}.start{font-size:17px}}\n@media(max-height:650px){.panel{height:98dvh;padding:8px 10px 6px}.statsCards{margin-top:4px}.historySummary{margin-top:4px}.historyList{margin-top:5px}.hist{padding:6px 2px}.day{padding:5px 2px 2px}
 .app{padding-top:6px}.top{grid-template-columns:110px 1fr 112px}.money,.start{height:49px}.history{height:47px;width:112px;font-size:13px}
 .hint{height:20px;font-size:11px}.status{height:20px}.order{padding:5px 8px}.timer{font-size:19px}.moneyRow{margin-top:0}.line2{margin-top:3px}.note,.complete,.delete{height:27px}
}

  .status{height:21px;font-size:11px}

  .ue,.num{font-size:15px}

}


.todayBar{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:4px;margin-top:3px;padding:4px 5px;border:1px solid #29434d;border-radius:9px;background:#0b1d25;color:#91a5ac;font-size:11px}
.todayBar span{text-align:center;white-space:nowrap}
.todayBar b{color:#ffc54e;font-size:13px;margin-left:2px}
 
.todayBar{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:4px;margin-top:3px;padding:4px 5px;border:1px solid #29434d;border-radius:9px;background:#0b1d25;color:#91a5ac;font-size:11px}
.todayBar span{text-align:center;white-space:nowrap}
.todayBar b{color:#ffc54e;font-size:13px;margin-left:2px}

.confirmBox{width:min(390px,100%);background:#0d252e;border:1px solid #2e5961;border-radius:20px;padding:21px 19px 16px;box-shadow:0 0 28px #000b;text-align:center}
.confirmIcon{width:46px;height:46px;margin:0 auto 10px;border:1px solid #456069;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8fa5ab;font-size:27px;font-weight:300}

.feeTitle{font-size:20px;font-weight:900;color:#edf4f5}
.feeSub{margin-top:4px;color:#22d9a0;font-size:13px;font-weight:800}
.feeInputWrap{height:62px;margin:17px 0 8px;border:1px solid #765f2f;border-radius:13px;background:#091c24;display:flex;align-items:center;justify-content:center;gap:8px}
.feeInputWrap span{color:#ffc34e;font-size:20px;font-weight:900}
.feeInputWrap input{width:120px;border:0;outline:0;background:transparent;color:#ffc34e;font-size:30px;font-weight:900;text-align:center}
.feeTip{color:#91a7ae;font-size:11px;line-height:1.5}
.feeActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
.feeActions button{height:44px;border-radius:11px;font-size:14px;font-weight:900}
.feeCancel{border:1px solid #38545e;background:#102a34;color:#b5c3c7}

@media(max-width:430px){
  .moneyRow{gap:6px}
  .moneyRow .editFee{margin-left:5px}
  .editFee,.delete{padding:0 7px;font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="money" title="新訂單起始金額">
      NT$ <input id="baseFee" type="number" min="45" step="1" value="45" aria-label="起始金額">
    </div>
    <button class="start" id="start">◷ 開始計時</button>
    <button class="history" id="history" aria-label="歷史訂單" title="歷史訂單">↶ 歷史訂單</button>
  </div>
  <div class="hintRow">
    <div class="moneyHint">起始金額可修改</div>
    <div class="guaranteeHint">依 245 元／時自動計算保障金額</div>
  </div>
  <div class="status" id="status">目前 0/4 筆，還可增加 4 筆</div>
  <div class="orders" id="orders"></div>
  <div class="todayBar">
    <span>今日 <b id="todayIncome">NT$0</b></span>
    <span>工作 <b id="todayWorkTime">0:00</b></span>
    <span>時薪 <b id="todayHourly">NT$0/hr</b></span>
  </div>
  <div class="footer">
    <span>今日完成 <b id="count">0</b> 筆</span>
    <span>今日收入 <b id="income">NT$0</b></span>
  </div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <div class="panelHead"><h2>↶ 歷史訂單</h2><button class="closeX" id="close">×</button></div>
    <div class="dateNav">
      <button class="dateArrow" id="prevDate" aria-label="前一天">‹</button>
      <button class="periodDate" id="periodDate">2026/09/05</button>
      <button class="dateArrow" id="nextDate" aria-label="後一天">›</button>
    </div>
    <button class="todayBtn" id="backToday">回到今天</button>
    <div class="tabs"><button class="tab active" id="todayTab">本日</button><button class="tab" id="weekTab">本週</button></div>
    <div class="statsCards">
      <div class="statCard"><span id="statPeriodLabel">今天跑多少</span><b id="statIncome">NT$0</b></div>
      <div class="statCard"><span>平均每小時</span><b id="statHourly">NT$0/hr</b></div>
      <div class="statCard"><span id="statHoursLabel">今天工作時間</span><b id="statHours">0 小時</b></div>
    </div>

    <div class="historySummary">
      <div><span id="periodLabel">本日收入</span><b id="periodIncome">NT$0</b></div>
      <div><span>完成筆數</span><b id="periodCount">0 筆</b></div>
    </div>
    <div class="historyList" id="historyList"></div>
    <button class="clear" id="clearHistory">清除歷史訂單</button>
  </div>
</div>

<div class="confirmModal" id="abandonModal">
  <div class="confirmBox">
    <div class="confirmIcon">×</div>
    <div class="confirmTitle">放棄這筆訂單？</div>
    <div class="confirmText">放棄後不會計入收入，也不會算完成單。</div>
    <div class="confirmActions">
      <button class="confirmCancel" id="abandonCancel">取消</button>
      <button class="confirmYes" id="abandonYes">放棄此單</button>
    </div>
  </div>
</div>
<div class="feeModal" id="feeModal">
  <div class="feeBox">
    <div class="feeTitle">修改訂單金額</div>
    <div class="feeSub" id="feeOrderLabel">UE #</div>
    <div class="feeInputWrap">
      <span>NT$</span>
      <input id="feeInput" type="number" min="45" step="1" inputmode="decimal" aria-label="訂單金額">
    </div>
    <div class="feeTip">輸入平台實際顯示的報酬，計時不會重新開始。</div>
    <div class="feeActions">
      <button class="feeCancel" id="feeCancel">取消</button>
      <button class="feeSave" id="feeSave">套用金額</button>
    </div>
  </div>
</div>
<script>
const KEY="delivery_pro_orders_v3";
const GUARANTEE=245;
let data=JSON.parse(localStorage.getItem(KEY)||"[]");

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function active(){return data.filter(o=>!o.deleted&&!o.completedAt).slice(-4)}
function money(o){
  const base=Number(o.baseFee||45);
  const elapsed=Math.max(0,(Date.now()-o.start)/3600000);
  return Math.max(base, GUARANTEE*elapsed);
}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function render(){
  const el=document.getElementById("orders");
  const list=active();
  el.innerHTML="";
  document.getElementById("status").textContent=`目前 ${list.length}/4 筆，還可增加 ${4-list.length} 筆`;
  if(!list.length){
    el.innerHTML='<div class="empty">◷<br>按「開始計時」<br>開始計算下一筆獨立訂單</div>';
  }else{
    list.forEach(o=>{
      const d=document.createElement("div");d.className="order running";
      d.innerHTML=`
        <div class="line1">
          <span class="badge">進行中</span><span class="ue">UE</span>
          <span class="num">#${o.no}</span><span class="timer" id="t-${o.id}">00:00</span>
        </div>
        <div class="moneyRow">
          <span class="price" id="p-${o.id}">NT$${money(o).toFixed(0)}</span>
          <button class="editFee" onclick="editFee('${o.id}')" aria-label="修改此單金額">修改金額</button>
          <button class="delete" onclick="deleteOrder('${o.id}')" aria-label="放棄此單">放棄此單</button>
        </div>
        <div class="line2">
          <input class="note" maxlength="50" inputmode="text" enterkeyhint="done" placeholder="備註（店名等）" value="${esc(o.note||"")}" oninput="setNote('${o.id}',this.value)">
          <button class="complete" onclick="complete('${o.id}')">配送完成</button>
        </div>`;
      el.appendChild(d);
      updateCard(o);
    });
  }
  updateSummary();
}
function updateCard(o){
  const t=document.getElementById("t-"+o.id),p=document.getElementById("p-"+o.id);
  if(t)t.textContent=fmt((Date.now()-o.start)/1000);
  if(p)p.textContent="NT$"+money(o).toFixed(0);
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setNote(id,v){const o=data.find(x=>String(x.id)===String(id));if(o){o.note=v;save()}}
function startOrder(){
  if(active().length>=4){alert("目前已滿 4 筆訂單，請先完成或刪除其中一筆。");return}
  const input=document.getElementById("baseFee");
  const base=Math.max(45,Number(input.value)||45);
  input.value=base;
  const no=(Math.max(0,...data.map(x=>Number(x.no)||0))+1);
  const o={id:Date.now()+"_"+Math.random().toString(36).slice(2),no,start:Date.now(),baseFee:base,note:""};
  data.push(o);save();render();
}
let abandonTarget=null;
let feeTarget=null;
function editFee(id){
  const o=data.find(x=>String(x.id)===String(id));
  if(!o)return;
  feeTarget=id;
  document.getElementById("feeOrderLabel").textContent="UE #"+o.no;
  document.getElementById("feeInput").value=Number(o.baseFee||45);
  document.getElementById("feeModal").style.display="flex";
  setTimeout(()=>{const i=document.getElementById("feeInput");i.focus();i.select()},80);
}
function closeFeeModal(){
  feeTarget=null;
  document.getElementById("feeModal").style.display="none";
}
function saveEditedFee(){
  if(feeTarget===null)return closeFeeModal();
  const o=data.find(x=>String(x.id)===String(feeTarget));
  if(!o)return closeFeeModal();
  const v=Number(document.getElementById("feeInput").value);
  if(!Number.isFinite(v)||v<45){
    document.getElementById("feeInput").focus();
    return;
  }
  o.baseFee=v;
  save();
  render();
  closeFeeModal();
}
function deleteOrder(id){
  const o=data.find(x=>String(x.id)===String(id));
  if(!o)return;
  abandonTarget=id;
  document.getElementById("abandonModal").style.display="flex";
}
function complete(id){
  const o=data.find(x=>String(x.id)===String(id));if(!o)return;
  o.completedAt=Date.now();
  o.finalFee=Math.max(Number(o.baseFee||45),GUARANTEE*((o.completedAt-o.start)/3600000));
  save();render();
}

function todayCompleted(){
  return data.filter(o=>o.completedAt&&!o.deleted&&isSameDay(o.completedAt));
}
function updateTodayBar(){
  const done=todayCompleted();
  const income=done.reduce((a,o)=>a+Number(o.finalFee||o.baseFee||45),0);
  const completedHours=done.reduce((a,o)=>a+Math.max(0,(o.completedAt-o.start)/3600000),0);
  const active=data.filter(o=>!o.deleted&&!o.completedAt&&isSameDay(o.start));
  const activeHours=active.reduce((a,o)=>a+Math.max(0,(Date.now()-o.start)/3600000),0);
  const hours=completedHours+activeHours;
  const hourly=hours>0?income/hours:0;
  document.getElementById("todayIncome").textContent="NT$"+income.toFixed(0);
  const mins=Math.floor(hours*60);
  document.getElementById("todayWorkTime").textContent=Math.floor(mins/60)+":"+pad2(mins%60);
  document.getElementById("todayHourly").textContent="NT$"+hourly.toFixed(0)+"/hr";
}
function updateSummary(){
  const today=new Date().toDateString();
  const done=data.filter(o=>o.completedAt&&!o.deleted&&new Date(o.completedAt).toDateString()===today);
  document.getElementById("count").textContent=done.length;
  document.getElementById("income").textContent="NT$"+done.reduce((a,o)=>a+Number(o.finalFee||o.baseFee||45),0).toFixed(0);updateTodayBar();
}

let historyMode="today";
let selectedDate=new Date();
selectedDate.setHours(0,0,0,0);

function shiftSelectedDate(days){
  selectedDate.setDate(selectedDate.getDate()+days);
  showHistory(historyMode);
}
function startOfSelectedWeek(){
  const d=new Date(selectedDate), day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day); d.setHours(0,0,0,0);
  return d;
}
function selectedWeekText(){
  const monday=startOfSelectedWeek();
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  return `${dateText(monday)} ～ ${dateText(sunday)}`;
}

function pad2(n){return String(n).padStart(2,"0")}
function dateText(d){return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`}
function weekRangeText(){
  const n=new Date(), day=(n.getDay()+6)%7;
  const monday=new Date(n); monday.setHours(0,0,0,0); monday.setDate(n.getDate()-day);
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  return `${dateText(monday)} ～ ${dateText(sunday)}`;
}
function isSameDay(ts){
  return new Date(ts).toDateString()===selectedDate.toDateString();
}
function isThisWeek(ts){
  const d=new Date(ts), monday=startOfSelectedWeek();
  const next=new Date(monday); next.setDate(monday.getDate()+7);
  return d>=monday && d<next;
}

function periodOrders(mode){
  return data.filter(o=>o.completedAt&&!o.deleted)
    .filter(o=>mode==="today"?isSameDay(o.completedAt):isThisWeek(o.completedAt))
    .sort((a,b)=>a.completedAt-b.completedAt);
}
function updateHistoryStats(mode, done){
  const income=done.reduce((a,o)=>a+Number(o.finalFee||o.baseFee||45),0);
  const hours=done.reduce((a,o)=>a+Math.max(0,(o.completedAt-o.start)/3600000),0);
  const hourly=hours>0?income/hours:0;
  document.getElementById("statPeriodLabel").textContent=mode==="today"?"今天跑多少":"本週跑多少";
  document.getElementById("statIncome").textContent="NT$"+income.toFixed(0);
  document.getElementById("statHourly").textContent="NT$"+hourly.toFixed(0)+"/hr";
  document.getElementById("statHoursLabel").textContent=mode==="today"?"今天工作時間":"本週工作時間";
  document.getElementById("statHours").textContent=(hours<10?hours.toFixed(1):hours.toFixed(0))+" 小時";


}
function showHistory(mode="today"){
  historyMode=mode;
  document.getElementById("todayTab").classList.toggle("active",mode==="today");
  document.getElementById("weekTab").classList.toggle("active",mode==="week");document.getElementById("periodDate").textContent=mode==="today"?dateText(selectedDate):"本週　"+selectedWeekText();
  document.getElementById("backToday").style.visibility =
    selectedDate.toDateString()===new Date().toDateString() ? "hidden" : "visible";
  const done=periodOrders(mode).reverse();
  updateHistoryStats(mode, done.slice().reverse());
  const income=done.reduce((a,o)=>a+Number(o.finalFee||o.baseFee||45),0);
  document.getElementById("periodLabel").textContent=mode==="today"?"本日收入":"本週收入";
  document.getElementById("periodIncome").textContent="NT$"+income.toFixed(0);
  document.getElementById("periodCount").textContent=done.length+" 筆";
  const list=document.getElementById("historyList");
  if(!done.length){list.innerHTML='<div class="empty" style="height:180px">目前沒有符合條件的歷史訂單</div>'}
  else{
    let last="";
    list.innerHTML=done.map(o=>{
      const day=new Date(o.completedAt).toLocaleDateString("zh-TW");
      const head=day!==last?(last=day,`<div class="day">${day}</div>`):"";
      const start=new Date(o.start).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
      const end=new Date(o.completedAt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
      return `${head}<div class="hist"><span>UE #${o.no}<br><small>${start}－${end}${o.note?"　"+esc(o.note):""}</small></span><span>${fmt((o.completedAt-o.start)/1000)}</span><b>NT$${Number(o.finalFee||o.baseFee||45).toFixed(0)}</b></div>`;
    }).join("");
  }
  document.getElementById("modal").style.display="flex";
}
document.getElementById("abandonCancel").onclick=()=>{abandonTarget=null;document.getElementById("abandonModal").style.display="none"};
document.getElementById("abandonYes").onclick=()=>{
  if(abandonTarget!==null){
    const o=data.find(x=>String(x.id)===String(abandonTarget));
    if(o){o.deleted=true;o.abandonedAt=Date.now();save();render();}
  }
  abandonTarget=null;document.getElementById("abandonModal").style.display="none";
};
document.getElementById("abandonModal").onclick=e=>{if(e.target.id==="abandonModal"){abandonTarget=null;e.currentTarget.style.display="none"}};
const feeCancelEl=document.getElementById("feeCancel");
const feeSaveEl=document.getElementById("feeSave");
const feeModalEl=document.getElementById("feeModal");
const feeInputEl=document.getElementById("feeInput");
if(feeCancelEl)feeCancelEl.onclick=closeFeeModal;
if(feeSaveEl)feeSaveEl.onclick=saveEditedFee;
if(feeModalEl)feeModalEl.onclick=e=>{if(e.target.id==="feeModal")closeFeeModal()};
if(feeInputEl)feeInputEl.addEventListener("keydown",e=>{if(e.key==="Enter")saveEditedFee()});
document.getElementById("start").onclick=startOrder;
document.getElementById("history").onclick=()=>showHistory("today");
document.getElementById("todayTab").onclick=()=>showHistory("today");
document.getElementById("weekTab").onclick=()=>showHistory("week");
document.getElementById("prevDate").onclick=()=>shiftSelectedDate(historyMode==="today"?-1:-7);
document.getElementById("nextDate").onclick=()=>shiftSelectedDate(historyMode==="today"?1:7);
document.getElementById("backToday").onclick=()=>{selectedDate=new Date();selectedDate.setHours(0,0,0,0);showHistory(historyMode)};
document.getElementById("close").onclick=()=>document.getElementById("modal").style.display="none";
document.getElementById("clearHistory").onclick=()=>{
  if(confirm("確定清除所有已完成的歷史訂單？")){
    data=data.filter(o=>!o.completedAt);save();showHistory(historyMode);render();
  }
};
setInterval(()=>{
  active().forEach(updateCard);
  updateSummary();
},500);
render();
</script>
