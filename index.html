<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07151d">
<title>外送助手 Pro｜獨立訂單計時</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#06141c;color:#e6f0f2;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.app{height:100dvh;max-width:760px;margin:auto;padding:10px 12px 8px;background:
radial-gradient(circle at 80% 10%,#16404455,transparent 28%),
linear-gradient(145deg,#112a35,#06141c 62%);display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:minmax(105px,145px) 1fr 58px;gap:8px;align-items:center;flex:0 0 auto}
.money{height:56px;border:1px solid #756033;border-radius:17px;background:#102731;color:#ffc54e;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.money input{width:70px;background:transparent;border:0;outline:0;color:#ffc54e;font-size:22px;font-weight:800;text-align:center}
.start{height:56px;border:0;border-radius:17px;background:#18dda0;color:#04231c;font-size:18px;font-weight:900;box-shadow:0 0 16px #18dda044}
.start:active,.complete:active,.history:active{transform:scale(.98)}
.history{height:52px;width:58px;border:1px solid #4b5961;border-radius:17px;background:#142832;color:#ffc54e;font-size:27px}
.hint{height:27px;display:flex;align-items:center;justify-content:center;color:#91a7ae;font-size:12px;flex:0 0 auto}
.status{height:25px;text-align:right;color:#9fb0b5;font-size:12px;flex:0 0 auto;padding-right:4px}
.orders{min-height:0;flex:1;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:6px}
.empty{height:100%;border:1px dashed #31525b;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;color:#879da4;font-size:14px;grid-row:1/5}
.order{min-height:0;border:1px solid #2d505a;border-radius:16px;background:#0b2029;padding:7px 9px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.order.running{border-color:#21c98e;box-shadow:0 0 9px #18d99b22}
.line1{display:grid;grid-template-columns:auto auto 1fr auto;gap:7px;align-items:center}
.badge{padding:3px 7px;border-radius:999px;background:#123d36;color:#22dba0;font-size:11px;font-weight:800;white-space:nowrap}
.ue{font-size:16px;font-weight:900;color:#dce8ec}.num{font-size:17px;font-weight:900;color:#fff}
.timer{font-size:22px;font-weight:900;color:#ffc34e;font-variant-numeric:tabular-nums;white-space:nowrap}
.price{font-size:19px;font-weight:900;color:#ffc34e;white-space:nowrap}
.line2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:5px}
.note{height:31px;min-width:0;background:#061720;border:1px solid #1d3842;border-radius:9px;padding:5px 8px;color:#dbe6e9;font-size:13px;outline:0}
.note::placeholder{color:#718991}
.note:focus{border-color:#2a8f7a}
.complete{height:31px;padding:0 13px;border:0;border-radius:9px;background:#18dda0;color:#04231c;font-size:13px;font-weight:900;white-space:nowrap}
.footer{display:flex;justify-content:space-between;padding:5px 3px 0;color:#91a5ac;font-size:12px;flex:0 0 auto}
.footer b{color:#fff}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end;justify-content:center;padding:10px}
.panel{width:min(720px,100%);height:min(78dvh,650px);background:#10252f;border:1px solid #38545e;border-radius:20px;padding:14px;display:flex;flex-direction:column}
.panelHead{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font-size:20px}.closeX{background:none;border:0;color:#9fb1b7;font-size:25px}
.historyList{overflow:auto;margin-top:8px;flex:1}
.day{color:#ffc34e;font-weight:800;font-size:13px;padding:10px 2px 4px}
.hist{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 3px;border-bottom:1px solid #29434d;font-size:13px}
.hist small{color:#80979f}.hist b{color:#ffc34e;font-size:16px}
.clear{margin-top:8px;height:40px;border:1px solid #63464b;background:#2b2024;color:#ffb0b0;border-radius:10px;font-weight:700}
@media(max-height:650px){
 .app{padding-top:6px}.top{grid-template-columns:110px 1fr 52px}.money,.start{height:49px}.history{height:47px;width:52px}
 .hint{height:20px;font-size:11px}.status{height:20px}.order{padding:5px 8px}.timer{font-size:19px}.line2{margin-top:3px}.note,.complete{height:27px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="money" title="新訂單起始金額">
      NT$ <input id="baseFee" type="number" min="45" step="1" value="45" aria-label="起始金額">
    </div>
    <button class="start" id="start">◷ 開始計時</button>
    <button class="history" id="history" aria-label="歷史訂單" title="歷史訂單">↶</button>
  </div>
  <div class="hint">起始金額可修改　｜　依 245 元／時自動計算保障金額</div>
  <div class="status" id="status">目前 0/4 筆，還可增加 4 筆</div>
  <div class="orders" id="orders"></div>
  <div class="footer">
    <span>今日完成 <b id="count">0</b> 筆</span>
    <span>今日收入 <b id="income">NT$0</b></span>
  </div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <div class="panelHead"><h2>↶ 歷史訂單</h2><button class="closeX" id="close">×</button></div>
    <div class="historyList" id="historyList"></div>
    <button class="clear" id="clearHistory">清除歷史訂單</button>
  </div>
</div>

<script>
const KEY="delivery_pro_orders_v3";
const GUARANTEE=245;
let data=JSON.parse(localStorage.getItem(KEY)||"[]");

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function active(){return data.filter(o=>!o.deleted&&!o.completedAt).slice(-4)}
function money(o){
  const base=Number(o.baseFee||45);
  const elapsed=Math.max(0,(Date.now()-o.start)/3600000);
  return Math.max(base, GUARANTEE*elapsed);
}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function render(){
  const el=document.getElementById("orders");
  const list=active();
  el.innerHTML="";
  document.getElementById("status").textContent=`目前 ${list.length}/4 筆，還可增加 ${4-list.length} 筆`;
  if(!list.length){
    el.innerHTML='<div class="empty">◷<br>按「開始計時」<br>開始計算下一筆獨立訂單</div>';
  }else{
    list.forEach(o=>{
      const d=document.createElement("div");d.className="order running";
      d.innerHTML=`
        <div class="line1">
          <span class="badge">進行中</span><span class="ue">UE</span>
          <span class="num">#${o.no}</span><span class="timer" id="t-${o.id}">00:00</span>
          <span class="price" id="p-${o.id}">NT$${money(o).toFixed(0)}</span>
        </div>
        <div class="line2">
          <input class="note" maxlength="50" placeholder="備註（店名等）" value="${esc(o.note||"")}" oninput="setNote('${o.id}',this.value)">
          <button class="complete" onclick="complete('${o.id}')">配送完成</button>
        </div>`;
      el.appendChild(d);
      updateCard(o);
    });
  }
  updateSummary();
}
function updateCard(o){
  const t=document.getElementById("t-"+o.id),p=document.getElementById("p-"+o.id);
  if(t)t.textContent=fmt((Date.now()-o.start)/1000);
  if(p)p.textContent="NT$"+money(o).toFixed(0);
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setNote(id,v){const o=data.find(x=>String(x.id)===String(id));if(o){o.note=v;save()}}
function startOrder(){
  if(active().length>=4){alert("目前已滿 4 筆訂單，請先完成或刪除其中一筆。");return}
  const input=document.getElementById("baseFee");
  const base=Math.max(45,Number(input.value)||45);
  input.value=base;
  const no=(Math.max(0,...data.map(x=>Number(x.no)||0))+1);
  const o={id:Date.now()+"_"+Math.random().toString(36).slice(2),no,start:Date.now(),baseFee:base,note:""};
  data.push(o);save();render();
}
function complete(id){
  const o=data.find(x=>String(x.id)===String(id));if(!o)return;
  o.completedAt=Date.now();
  o.finalFee=Math.max(Number(o.baseFee||45),GUARANTEE*((o.completedAt-o.start)/3600000));
  save();render();
}
function updateSummary(){
  const today=new Date().toDateString();
  const done=data.filter(o=>o.completedAt&&!o.deleted&&new Date(o.completedAt).toDateString()===today);
  document.getElementById("count").textContent=done.length;
  document.getElementById("income").textContent="NT$"+done.reduce((a,o)=>a+Number(o.finalFee||o.baseFee||45),0).toFixed(0);
}
function showHistory(){
  const list=document.getElementById("historyList");
  const done=data.filter(o=>o.completedAt&&!o.deleted).sort((a,b)=>b.completedAt-a.completedAt);
  if(!done.length){list.innerHTML='<div class="empty" style="height:180px">尚無歷史訂單</div>'}
  else{
    let last="";
    list.innerHTML=done.map(o=>{
      const day=new Date(o.completedAt).toLocaleDateString("zh-TW");
      const head=day!==last?(last=day,`<div class="day">${day}</div>`):"";
      const start=new Date(o.start).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
      const end=new Date(o.completedAt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
      return `${head}<div class="hist"><span>UE #${o.no}<br><small>${start}－${end}${o.note?"　"+esc(o.note):""}</small></span><span>${fmt((o.completedAt-o.start)/1000)}</span><b>NT$${Number(o.finalFee||o.baseFee||45).toFixed(0)}</b></div>`;
    }).join("");
  }
  document.getElementById("modal").style.display="flex";
}
document.getElementById("start").onclick=startOrder;
document.getElementById("history").onclick=showHistory;
document.getElementById("close").onclick=()=>document.getElementById("modal").style.display="none";
document.getElementById("clearHistory").onclick=()=>{
  if(confirm("確定清除所有已完成的歷史訂單？")){
    data=data.filter(o=>!o.completedAt);save();showHistory();render();
  }
};
setInterval(()=>{
  active().forEach(updateCard);
  updateSummary();
},500);
render();
</script>
</body>
</html>
